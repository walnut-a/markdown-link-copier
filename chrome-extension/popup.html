<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>Markdown Link Copier</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body data-page="popup">
    <main>
      <h1>复制链接文本</h1>
      <p id="status" role="status" aria-live="polite">正在准备...</p>
      <p id="title-source" class="hint" hidden></p>
      <textarea
        id="result-preview"
        aria-label="已复制内容"
        rows="3"
        readonly
        spellcheck="false"
        hidden
      ></textarea>
      <div class="popup-actions">
        <button id="open-settings" class="secondary-button" type="button">设置</button>
        <button id="open-shortcuts" class="secondary-button" type="button">快捷键</button>
      </div>
    </main>
    <script src="popup.js" type="module"></script>
  </body>
</html>
