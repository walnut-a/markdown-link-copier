<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>Markdown Link Copier</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body data-page="popup">
    <main class="popup-shell">
      <h1>复制链接文本</h1>
      <p id="status" data-state="loading" role="status" aria-live="polite">正在准备...</p>
      <section id="result-panel" class="result-panel" aria-label="复制结果" hidden>
        <span id="title-source" class="result-source" hidden></span>
        <textarea
          id="result-preview"
          aria-label="已复制内容"
          rows="3"
          readonly
          spellcheck="false"
          hidden
        ></textarea>
      </section>
      <div class="popup-actions">
        <button id="open-settings" class="secondary-button" type="button">设置</button>
        <button id="open-shortcuts" class="secondary-button" type="button">快捷键</button>
      </div>
    </main>
    <script src="popup.js" type="module"></script>
  </body>
</html>
