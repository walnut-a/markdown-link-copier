<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>Markdown Link Copier</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body data-page="popup">
    <main class="popup-shell">
      <header class="popup-header">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="M9.5 14.5 14.5 9.5"></path>
            <path d="m7.2 16.8-1.1 1.1a3.5 3.5 0 0 1-5-5l3.2-3.2a3.5 3.5 0 0 1 5 0"></path>
            <path d="m16.8 7.2 1.1-1.1a3.5 3.5 0 0 1 5 5l-3.2 3.2a3.5 3.5 0 0 1-5 0"></path>
          </svg>
        </span>
        <span>
          <h1>复制链接文本</h1>
          <span class="popup-subtitle">干净、准确，随手可用</span>
        </span>
      </header>
      <p id="status" data-state="loading" role="status" aria-live="polite">正在准备...</p>
      <section id="result-panel" class="result-panel" aria-label="复制结果" hidden>
        <div class="result-meta">
          <span class="result-label">复制内容</span>
          <span id="title-source" class="source-badge" hidden></span>
        </div>
        <textarea
          id="result-preview"
          aria-label="已复制内容"
          rows="3"
          readonly
          spellcheck="false"
          hidden
        ></textarea>
      </section>
      <div class="popup-actions">
        <button id="open-settings" class="secondary-button" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6 1.7 1.7 0 0 0 10 3v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"></path>
          </svg>
          设置
        </button>
        <button id="open-shortcuts" class="secondary-button" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="3" y="5" width="18" height="14" rx="2"></rect>
            <path d="M7 9h.01M11 9h.01M15 9h.01M18 9h.01M7 13h.01M11 13h.01M15 13h3M7 16h10"></path>
          </svg>
          快捷键
        </button>
      </div>
    </main>
    <script src="popup.js" type="module"></script>
  </body>
</html>
